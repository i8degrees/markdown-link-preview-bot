# Docker compose project for testing & running discord bot
#
#
---

#networks:
#  traefik-proxy:
#    external: true

services:
  markdown-link-preview-bot:
    build:
      context: .
      dockerfile: "Dockerfile"
    command: ["/app/venv/bin/python3", "src/bot"]
    image: i8degrees/markdown-link-preview-bot:1.1.0
    container_name: markdown-link-preview-bot-1
    restart: unless-stopped
    tty: true
    volumes:
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env

