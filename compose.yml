# Docker compose project for testing & running discord_bot.py
#
#
---

#networks:
#  traefik-proxy:
#    external: true

services:
  markdown-link-preview-bot:
    build:
      context: .
      dockerfile: "Dockerfile"
    command: ["/app/venv/bin/python3", "discord_bot.py"]
    image: i8degrees/discord-bot:1.0.0
    container_name: discord-bot-1
    restart: unless-stopped
    tty: true
    volumes:
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env

